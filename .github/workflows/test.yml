name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global --no-audit --no-fund markdownlint-cli@0.49.1
      - run: markdownlint --config scripts/.markdownlint.json '**/*.md'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: |
          npm --prefix src/frontend/launcher ci
          npm --prefix src/frontend/launcher run build
